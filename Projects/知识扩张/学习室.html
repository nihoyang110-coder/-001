    <div class="keypts"><b>要点</b><ul>${l.key_points.map(k => `<li>${esc(k)}</li>`).join("")}</ul></div>
    <details class="card src"><summary>原始资料（${l.sources.length}）</summary><ul>${l.sources.map(s =>
      `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>${s.note ? " — " + esc(s.note) : ""}</li>`).join("")}</ul></details>
  </section>

  <section class="step" id="s2"><div class="step-h"><span class="n">2</span><h2>看视频</h2></div>
    ${l.videos?.length ? l.videos.map(v => `<div class="card video"><h3><a href="${esc(v.url)}" target="_blank" rel="noopener">${esc(v.title)}</a></h3>
      <span class="meta">${esc(v.channel)}${v.minutes ? " · 约 " + v.minutes + " 分钟" : ""}${v.lang ? " · " + esc(v.lang) : ""}</span>
      <p>${esc(v.why)}</p>${v.watch_for ? `<p class="small"><b>重点看：</b>${esc(v.watch_for)}</p>` : ""}
      ${v.caveat ? `<p class="small muted">${esc(v.caveat)}</p>` : ""}</div>`).join("") : `<p class="muted">这个主题暂时没找到合适的公开视频，资料部分已覆盖。</p>`}
  </section>

  <section class="step" id="s3"><div class="step-h"><span class="n">3</span><h2>做测验</h2></div>
    <div class="card"><h3>选择题（${l.quiz.mcq.length} 题，占理解分 40%）</h3>
      ${l.quiz.mcq.map((q,i) => `<div class="q" data-q="${i}"><div class="qt">${i+1}. ${esc(q.q)}</div>
        ${q.options.map((o,j) => `<label class="opt" id="o${i}_${j}"><input type="radio" name="m${i}" value="${j}" ${p.mcq?.answers?.[i] === j || (!p.mcq && d.mcq?.[i] === j) ? "checked" : ""}><span>${esc(o)}</span></label>`).join("")}
        <div class="explain" id="e${i}" hidden></div></div>`).join("")}
      <div class="row"><button class="btn" id="mcqBtn">交卷</button><span class="status" id="mcqStatus"></span></div></div>
    ${l.quiz.short.map((q,i) => `<div class="card" data-s="${i}"><h3>简答 ${i+1}</h3><p>${esc(q.q)}</p>
      <details class="rub"><summary>评分要点（共 ${q.rubric.reduce((a,r)=>a+r.pts,0)} 分）</summary><ul>${q.rubric.map(r => `<li>${esc(r.point)}（${r.pts} 分）</li>`).join("")}</ul></details>
      <textarea id="sa${i}" placeholder="用自己的话回答，几句话即可">${esc(p.short?.[i]?.answer ?? d.short?.[i] ?? "")}</textarea>
      <div class="row"><button class="btn" data-grade="short" data-i="${i}">提交给 Claude 评分</button><span class="status" id="ss${i}"></span></div>
      <div id="sr${i}"></div></div>`).join("")}
  </section>

  <section class="step" id="s4"><div class="step-h"><span class="n">4</span><h2>交作业</h2></div>
    <div class="card prose"><h3>${esc(l.assignment.title)}</h3>${fmt(l.assignment.task)}
      <p class="small"><b>交什么：</b>${esc(l.assignment.deliverable)}</p>
      <details class="rub" open><summary>评分表（满分 100，${PASS} 分达标）</summary><ul>${l.assignment.rubric.map(r => `<li><b>${esc(r.part)}</b> ${r.points} 分：${esc(r.criteria)}</li>`).join("")}</ul></details>
      ${l.assignment.practice ? `<p class="small muted">配套实践：${esc(l.assignment.practice)}</p>` : ""}
      <textarea id="asg" style="min-height:180px" placeholder="在这里写作业">${esc(p.assignment?.answer ?? d.assignment ?? "")}</textarea>
      <div class="row"><button class="btn" data-grade="assignment">提交并请 Claude 预评</button><span class="status" id="as"></span></div>
      <div id="ar"></div></div>
  </section>

  <section class="step" id="s5"><div class="step-h"><span class="n">5</span><h2>看成绩</h2></div><div id="scoreBox"></div></section>`;

  // 草稿：每次输入只存在本机
  current = l;
  const persist = () => saveDraft(l.id, {
    mcq: l.quiz.mcq.map((_,i) => { const c = document.querySelector(`input[name=m${i}]:checked`); return c ? +c.value : null; }),
    short: l.quiz.short.map((_,i) => $("#sa"+i).value), assignment: $("#asg").value });
  persistFn = persist;
  document.querySelectorAll(".steps a").forEach(a => a.addEventListener("click", e => { e.preventDefault(); document.getElementById(a.dataset.step).scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); }));
  $("#mcqBtn").onclick = () => submitMcq(l);
  document.querySelectorAll("[data-grade]").forEach(b => b.onclick = () => grade(l, b.dataset.grade, +b.dataset.i));
  if (p.mcq) showMcq(l, p.mcq.answers);
  l.quiz.short.forEach((_,i) => p.short?.[i]?.score != null && showResult("#sr"+i, p.short[i]));
  if (p.assignment?.result) showResult("#ar", p.assignment.result, p.assignment.final);
  renderScores(l);
  if (!sample && sampleChecked) noteNoSample();
  window.scrollTo(0,0);
}

function showMcq(l, answers){
  let right = 0;
  l.quiz.mcq.forEach((q,i) => {
    q.options.forEach((_,j) => { const el = $(`#o${i}_${j}`); el.classList.toggle("right", j === q.answer); el.classList.toggle("wrong", answers[i] === j && j !== q.answer); });
    if (answers[i] === q.answer) right++;
    const e = $("#e"+i); e.hidden = false; e.textContent = (answers[i] === q.answer ? "答对了。" : "正确答案是第 " + (q.answer+1) + " 项。") + q.explain;
  });
  $("#mcqStatus").textContent = `${right} / ${l.quiz.mcq.length} 题正确`;
  return right;
}

async function submitMcq(l){
  const answers = l.quiz.mcq.map((_,i) => { const c = document.querySelector(`input[name=m${i}]:checked`); return c ? +c.value : null; });
  if (answers.includes(null)) { $("#mcqStatus").textContent = "还有题没选"; return; }
  const score = showMcq(l, answers);
  await save(l, { mcq: { answers, score, total: l.quiz.mcq.length, at: new Date().toISOString() } });
}

function showResult(sel, r, final){
  $(sel).innerHTML = `<div class="result"><div><span class="big">${r.score}</span> / ${r.max}${final != null ? ` · 复核后 <b>${final}</b>` : ""}</div>
    ${(r.points||[]).map(x => `<div class="small">${esc(x.point)}：${x.got} 分 — ${esc(x.comment)}</div>`).join("")}
    ${r.feedback ? `<div>${esc(r.feedback)}</div>` : ""}</div>`;
}

function noteNoSample(){
  document.querySelectorAll("[data-grade]").forEach(b => b.textContent = "保存答案（之后由 Claude 评分）");
}

async function grade(l, kind, i){
  const isA = kind === "assignment";
  const q = isA ? { q: l.assignment.task, rubric: l.assignment.rubric.map(r => ({point: r.part + "：" + r.criteria, pts: r.points})), ref: l.assignment.reference || "" }
                : { q: l.quiz.short[i].q, rubric: l.quiz.short[i].rubric, ref: l.quiz.short[i].ref_answer };
  const ans = (isA ? $("#asg") : $("#sa"+i)).value.trim();
  const st = isA ? $("#as") : $("#ss"+i), out = isA ? "#ar" : "#sr"+i;
  if (ans.length < 10) { st.textContent = "先写几句再提交"; return; }
  const max = q.rubric.reduce((a,r) => a + r.pts, 0);
  if (!sample) {
    await save(l, isA ? { assignment: { answer: ans, at: new Date().toISOString() } } : { short: { [i]: { answer: ans, score: null, at: new Date().toISOString() } } });
    st.textContent = db ? "已保存，等 Claude 评分" : "已存到本机草稿";
    return;
  }
  const btns = document.querySelectorAll("[data-grade]"); btns.forEach(b => b.disabled = true);
  st.textContent = "Claude 正在评分…";
  const prompt = `你是严格但友善的阅卷老师，学生是在学“${l.title}”的中文自学者。按评分要点给分，每个要点只能给 0 到该要点满分之间的整数，答到意思即可给分，没答到就不给。参考答案只用来判断，不要求措辞一致。
题目：${q.q}
评分要点：${q.rubric.map((r,k) => `${k+1}. ${r.point}（满分 ${r.pts}）`).join("；")}
参考答案：${q.ref || "无"}
学生答案：${ans}
只回复 JSON：{"points":[{"point":"要点简称","got":整数,"comment":"一句中文点评"}],"feedback":"两三句中文总评：哪里好，还缺什么"}`;
  try {
    const r = await sample.json(prompt, { cache: false });
    const pts = Array.isArray(r?.points) ? r.points.slice(0, q.rubric.length).map((x,k) => ({ point: String(x.point || q.rubric[k].point).slice(0,40), got: Math.max(0, Math.min(q.rubric[k].pts, Math.round(+x.got || 0))), comment: String(x.comment || "") })) : [];
    const res = { score: pts.reduce((a,x) => a + x.got, 0), max, points: pts, feedback: String(r?.feedback || "") };
    showResult(out, res);
    st.textContent = "";
    await save(l, isA ? { assignment: { answer: ans, result: res, at: new Date().toISOString() } } : { short: { [i]: { answer: ans, ...res, at: new Date().toISOString() } } });
  } catch (e) {
    const m = { not_granted: "没有允许页面调用 Claude，答案已保存，之后由 Claude 评分", sampling_disabled: "这个账号不能在页面里调用 Claude，答案已保存", rate_limited: "调用太频繁，过一会儿再试", invalid_json: "评分结果没解析出来，再点一次试试", session_expired: "登录已过期，请重新登录" }[e?.code] || "评分没成功，稍后再试";
    st.textContent = m;
    if (e?.code === "not_granted" || e?.code === "sampling_disabled") { sample = null; noteNoSample(); await save(l, isA ? { assignment: { answer: ans } } : { short: { [i]: { answer: ans, score: null } } }); }
  } finally { btns.forEach(b => b.disabled = false); }
}

async function save(l, patch){
  const cur = prog[l.id] || {};
  const next = { ...cur, ...patch, short: { ...(cur.short||{}), ...(patch.short||{}) }, lesson: l.id, updated: new Date().toISOString() };
  if (!patch.short && !cur.short) delete next.short;
  prog[l.id] = next;
  renderScores(l);
  if (!db) return;
  try { await db.doc("progress/" + l.id).set(next); }
  catch (e) { const s = $("#mcqStatus"); if (s) s.textContent = "进度没保存成功（" + (e?.code || "未知") + "），本机草稿还在"; }
}

function renderScores(l){
  const box = $("#scoreBox"); if (!box) return;
  const p = prog[l.id], u = understanding(p, l), a = assignScore(p);
  const cell = (name, v, note) => `<div class="score"><span class="small muted">${name}</span><b class="${v == null ? "" : v >= PASS ? "pass" : "fail"}">${v ?? "–"}</b>
    <div class="bar"><i style="width:${v ?? 0}%"></i></div><span class="small muted">${note}</span></div>`;
  const pass = u != null && a != null && u >= PASS && a >= PASS;
  box.innerHTML = `<div class="scores">${cell("理解分", u, "选择 40% + 简答 60%")}${cell("作业分", a, p?.assignment?.final != null ? "已复核" : "Claude 预评，待复核")}</div>
    <div class="card"><b>${pass ? "两项都达标：这个主题算学会了" : `还差：${u == null ? "测验没做完；" : u < PASS ? "理解分未到 " + PASS + "；" : ""}${a == null ? "作业没交；" : a < PASS ? "作业分未到 " + PASS + "；" : ""}`}</b>
    <span class="small muted">达标后，地图上的 ${(l.areas||[]).join("、")} 升 1 级（由主会话记录）。可以反复作答，以最后一次为准。</span></div>`;
}

function route(){
  const id = (location.hash || "").slice(1).toUpperCase();
  const l = L.find(x => x.id === id);
  if (l) renderLesson(l); else { current = null; persistFn = null; renderIndex(); }
}
window.addEventListener("hashchange", route);
route();

(async () => {
  try {
    db = await window.claude?.use?.("db") ?? null;
    let first = true;
    if (db) db.collection("progress").onSnapshot(snap => {
      snap.docs.forEach(d => { prog[d.id] = d.data(); });
      // 第一次拿到存档时重画一遍，之后只更新成绩，避免打断正在写的答案
      if (first || !current) { first = false; route(); } else renderScores(current);
    }, () => {});
  } catch {}
  try { sample = await window.claude?.use?.("sample") ?? null; } catch {}
  sampleChecked = true;
  if (!sample && location.hash) noteNoSample();
})();
</script>
