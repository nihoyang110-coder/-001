<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>卡片</title>
<!-- 新粗野主义（Neo-brutalism）卡片模板：参考 ekmas/neobrutalism-components。
     同目录需要：content.js（内容）、fonts.css（scripts/setup_fonts.sh 生成）、icons/（Fluent 3D 图标）。
     出图：node scripts/render_cards.cjs template.html cards -->
<link rel="stylesheet" href="fonts.css">
<style>
  :root { --bg:hsl(214,95%,93%); --white:#fff; --ink:#000; --main:hsl(217,100%,66%); --y:#facc00; --r:#ff4d50; --g:#05e17a; --v:#7a83ff; --sh:6px 6px 0 0 #000; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#777; font-family:"NSans","WenQuanYi Zen Hei",sans-serif; color:var(--ink); }
  .card { width:1080px; height:1440px; margin:0 auto 40px; background:var(--bg); padding:56px 56px 40px; display:flex; flex-direction:column; gap:26px;
    background-image:linear-gradient(rgba(0,0,0,.06) 2px, transparent 2px), linear-gradient(90deg, rgba(0,0,0,.06) 2px, transparent 2px); background-size:60px 60px; }
  .b { background:var(--white); border:4px solid var(--ink); border-radius:8px; box-shadow:var(--sh); padding:30px 34px; position:relative; }
  .top { display:flex; justify-content:space-between; align-items:center; }
  .pill { border:4px solid var(--ink); border-radius:8px; box-shadow:4px 4px 0 0 #000; background:var(--y); font-weight:900; font-size:28px; padding:8px 20px; }
  .pg { font-weight:900; font-size:30px; background:var(--white); border:4px solid #000; border-radius:8px; padding:6px 16px; box-shadow:4px 4px 0 0 #000; }
  h1 { font-weight:900; font-size:100px; line-height:1.12; letter-spacing:-1px; }
  h2 { font-weight:900; font-size:72px; line-height:1.18; }
  .mark { display:inline-block; background:var(--y); padding:2px 12px; border:4px solid #000; line-height:1.15; margin-top:12px; }
  .mk-r { background:var(--r); color:#fff; } .mk-b { background:var(--main); color:#fff; } .mk-g { background:var(--g); }
  .foot { margin-top:auto; display:flex; justify-content:space-between; gap:24px; font-size:20px; font-weight:500; line-height:1.5; }
  .foot b { white-space:nowrap; font-weight:900; }
  .lab { font-size:26px; font-weight:800; }
  .num { font-weight:900; line-height:1; letter-spacing:-3px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:26px; }
  .sticker { position:absolute; transform:rotate(8deg); filter:drop-shadow(6px 6px 0 #000); }
  .row { display:flex; gap:24px; align-items:flex-start; }
  .p { font-size:30px; line-height:1.5; font-weight:500; }
  .bars { display:flex; gap:60px; align-items:flex-end; height:400px; border-bottom:5px solid #000; padding:0 20px; }
  .g { flex:1; display:flex; gap:12px; align-items:flex-end; height:100%; }
  .bar { flex:1; border:4px solid #000; border-bottom:none; position:relative; box-shadow:5px 0 0 0 #000; }
  .bar span { position:absolute; top:-60px; left:-10px; right:-10px; text-align:center; font-weight:900; font-size:44px; }
  .xl { display:flex; gap:60px; padding:14px 20px 0; } .xl div { flex:1; text-align:center; font-weight:800; font-size:26px; }
  .n { flex:0 0 72px; height:72px; border:4px solid #000; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:36px; box-shadow:4px 4px 0 0 #000; }
  .pred { font-size:22px; font-weight:900; background:var(--r); color:#fff; border:3px solid #000; padding:2px 10px; margin-left:12px; vertical-align:8px; }
  .ico { filter:drop-shadow(4px 4px 0 #000); }
</style></head><body>
<script src="content.js"></script>
<script>
const C = window.CONTENT, T = 8, I = n => `icons/${n}_3d.png`;
const COL = { y:'var(--y)', r:'var(--r)', g:'var(--g)', b:'var(--main)', v:'var(--v)', w:'var(--white)', k:'#000' };
const fg = c => ['r', 'b', 'v', 'k'].includes(c) ? '#fff' : '#000';
const card = (i, tag, inner, src) => `<section class="card"><div class="top"><span class="pill">${tag}</span><span class="pg">${i}/${T}</span></div>${inner}<div class="foot"><span>${src}</span><b>${C.handle}</b></div></section>`;
let h = '';
// 1 封面：大标题 + 大数字 + 两个对比药丸 + 副标题条
const cv = C.cover;
h += card(1, cv.tag, `<div class="b" style="flex:1;display:flex;flex-direction:column">
  ${cv.icon ? `<img class="sticker" style="right:30px;top:40px;width:260px;height:260px" src="${I(cv.icon)}">` : ''}
  <h1 style="margin-top:20px">${cv.lines.slice(0, -1).join('<br>')}<br><span class="mark">${cv.lines[cv.lines.length - 1]}</span></h1>
  <div style="display:flex;align-items:flex-end;gap:20px;margin-top:40px"><div class="num" style="font-size:300px;color:var(--r);text-shadow:10px 10px 0 #000">${cv.big}</div><div class="lab" style="margin-bottom:40px">${cv.bigNote || ''}</div></div>
  ${(cv.pills || []).length ? `<div style="display:flex;gap:24px;margin-top:auto">${cv.pills.map(p => `<div class="b" style="flex:1;background:${COL[p.color] || COL.y};color:${fg(p.color)};display:flex;align-items:center;gap:18px">${p.icon ? `<img style="width:110px;height:110px" src="${I(p.icon)}">` : ''}<div><div class="lab">${p.label}</div><div class="num" style="font-size:90px">${p.value}</div></div></div>`).join('')}</div>` : ''}</div>
  <div class="b" style="background:var(--main);color:#fff"><div style="font-weight:900;font-size:42px;line-height:1.4">${cv.sub}</div></div>`, cv.src);
// 2 事实：2×2 色块
const fc = ['var(--y)', 'var(--white)', 'var(--white)', 'var(--g)'];
h += card(2, C.facts.tag, `<h2>${C.facts.title}</h2><div class="grid2" style="flex:1">${C.facts.rows.map((r, i) => `<div class="b" style="background:${fc[i % 4]};display:flex;flex-direction:column"><div class="lab">${r.k}</div><div class="p" style="margin-top:auto">${r.v}</div><div style="font-weight:900;font-size:56px;margin-top:8px">${r.hi}</div></div>`).join('')}</div>`, C.facts.src);
// 3 小切口：分组柱状图 + 两个结论块
const ch = C.chart, g = ch.groups, mx = Math.max(...g.flatMap(x => [x.dine, x.take]));
h += card(3, ch.tag, `<h2>${ch.title}<br><span class="mark mk-r">${ch.titleHi}</span></h2>
  <div class="b" style="flex:1;display:flex;flex-direction:column"><div style="display:flex;gap:30px;font-weight:800;font-size:26px;margin-bottom:auto"><span><i style="display:inline-block;width:28px;height:28px;border:3px solid #000;background:var(--r);margin-right:8px;vertical-align:-5px"></i>${ch.legend.dine}</span><span><i style="display:inline-block;width:28px;height:28px;border:3px solid #000;background:var(--main);margin-right:8px;vertical-align:-5px"></i>${ch.legend.take}</span></div>
  <div class="bars">${g.map(x => `<div class="g"><div class="bar" style="height:${x.dine / mx * 360}px;background:var(--r)"><span>${x.dine}${ch.unit ?? '%'}</span></div><div class="bar" style="height:${Math.max(x.take / mx * 360, 16)}px;background:var(--main)"><span>${x.take}${ch.unit ?? '%'}</span></div></div>`).join('')}</div>
  <div class="xl">${g.map(x => `<div>${x.label}</div>`).join('')}</div></div>
  <div class="grid2">${g.map((x, i) => `<div class="b" style="${i === g.length - 1 ? 'background:var(--r);color:#fff' : ''}"><div class="lab">${x.label} · ${x.gapLabel || '差距'}</div><div class="num" style="font-size:110px">${x.gapNum ?? x.gap}</div></div>`).join('')}</div>`, ch.src);
// 4 谁得利：两个大数字 + 要点
h += card(4, C.gain.tag, `<h2>${C.gain.title}<br><span class="mark mk-g">${C.gain.titleHi}</span></h2>
  <div class="grid2" style="flex:1">${C.gain.stats.map((s, i) => `<div class="b" style="background:${i ? 'var(--v)' : 'var(--white)'};${i ? 'color:#fff' : ''};display:flex;flex-direction:column"><div class="lab">${s.label}</div><div class="num" style="font-size:180px;margin-top:auto">${s.n}</div><div class="lab">${s.unit}</div></div>`).join('')}</div>
  <div class="b">${C.gain.points.map((p, i) => `<div class="row" style="padding:10px 0"><span class="n" style="flex:0 0 52px;height:52px;font-size:26px;background:${['var(--y)', 'var(--g)', 'var(--r)'][i % 3]}">${i + 1}</span><span class="p" style="padding-top:6px">${p}</span></div>`).join('')}</div>`, C.gain.src);
// 5 谁吃亏：带图标的行 + 黑底结论
const lc = ['var(--r)', 'var(--y)', 'var(--main)'];
h += card(5, C.loss.tag, `<h2>${C.loss.title}</h2>${C.loss.rows.map((r, i) => `<div class="b" style="display:flex;gap:28px;align-items:center">${r.icon ? `<img class="ico" style="width:120px;height:120px" src="${I(r.icon)}">` : ''}<div><div style="font-weight:900;font-size:50px"><span class="mark" style="margin-top:0;background:${lc[i % 3]};${i % 3 === 1 ? '' : 'color:#fff'}">${r.who}</span></div><div class="p" style="margin-top:12px">${r.what}</div></div></div>`).join('')}
  <div class="b" style="background:#000;color:#fff;box-shadow:6px 6px 0 0 var(--y)"><div style="font-weight:900;font-size:40px;line-height:1.45">${C.loss.kicker}</div></div>`, C.loss.src);
// 6 放大看：编号链条 + 历史对照
h += card(6, C.chain.tag, `<h2>${C.chain.title}</h2>${C.chain.steps.map((s, i) => `<div class="b" style="display:flex;gap:26px;align-items:center;padding:24px 30px;${s.pred ? 'background:var(--y)' : ''}"><span class="n" style="background:${['var(--white)', 'var(--g)', 'var(--r)', 'var(--main)'][i % 4]};${i % 4 > 1 ? 'color:#fff' : ''}">${i + 1}</span><div><div style="font-weight:900;font-size:44px">${s.t}${s.pred ? '<span class="pred">预测</span>' : ''}</div><div class="p" style="font-size:26px">${s.d}</div></div></div>`).join('')}
  ${C.chain.compare ? `<div class="b" style="background:var(--v);color:#fff"><div class="p" style="font-size:26px;line-height:1.65">${C.chain.compare}</div></div>` : ''}`, C.chain.src);
// 7 卡在哪：红色大字块（第 1 个障碍）+ 其余障碍 + 补位图标
const bk = C.block, hero = bk.hero || {};
h += card(7, bk.tag, `<h2>${bk.title}</h2>
  <div class="b" style="background:var(--r);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:20px"><div><div class="lab">${hero.label || ''}</div><div class="num" style="font-size:170px;text-shadow:7px 7px 0 #000">${hero.big || bk.items[0].t}</div><div class="p" style="margin-top:14px;font-weight:700">${bk.items[0].d}</div></div>${hero.icon ? `<img class="ico" style="width:200px;height:200px;filter:drop-shadow(6px 6px 0 #000)" src="${I(hero.icon)}">` : ''}</div>
  <div class="grid2" style="flex:1">${bk.items.slice(1).concat(bk.items.length % 2 === 0 && bk.fillerIcon ? [null] : []).map(it => it ? `<div class="b" style="display:flex;flex-direction:column"><div style="font-weight:900;font-size:40px">${it.t}</div><div class="p" style="font-size:26px;margin-top:auto">${it.d}</div></div>` : `<div class="b" style="background:var(--y);display:flex;align-items:center;justify-content:center"><img class="ico" style="width:180px;height:180px" src="${I(bk.fillerIcon)}"></div>`).join('')}</div>`, bk.src);
// 8 以小见大：金句 + 三个观察点
const e = C.end, q = e.quote, hiFrom = e.highlightFrom ?? Math.ceil(q.length / 2);
h += card(8, e.tag, `<div class="b" style="flex:1;display:flex;flex-direction:column;justify-content:center"><div style="font-weight:900;font-size:80px;line-height:1.35">${q.map((l, i) => i >= hiFrom ? `<span class="mark mk-r">${l}</span>` : l).join('<br>')}</div></div>
  <div class="grid2" style="grid-template-columns:repeat(${e.watch.length},1fr)">${e.watch.map((w, i) => `<div class="b" style="background:${['var(--y)', 'var(--g)', 'var(--white)'][i % 3]}"><div class="lab">${w[0]}</div><div style="font-weight:900;font-size:34px;margin-top:8px;line-height:1.3">${w[1]}</div></div>`).join('')}</div>`, e.src);
document.body.insertAdjacentHTML('beforeend', h);
</script>
</body></html>
