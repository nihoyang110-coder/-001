<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>YouTube 缩略图</title>
<!-- YouTube 16:9 缩略图（1280×720），读 content.js 的 youtube 字段（缺省时退回 cover）。出图：node scripts/render_cards.cjs youtube-thumb.html cards-youtube -->
<link rel="stylesheet" href="fonts.css">
<style>
  :root { --bg:hsl(214,95%,93%); --y:#facc00; --r:#ff4d50; --g:#05e17a; --main:hsl(217,100%,66%); }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#777; font-family:"NSans","WenQuanYi Zen Hei",sans-serif; }
  .card { width:1280px; height:720px; margin:0 auto; background:var(--bg); padding:56px 64px; display:flex; gap:48px; align-items:center; position:relative; overflow:hidden;
    background-image:linear-gradient(rgba(0,0,0,.06) 2px, transparent 2px), linear-gradient(90deg, rgba(0,0,0,.06) 2px, transparent 2px); background-size:48px 48px; }
  .b { background:#fff; border:5px solid #000; border-radius:10px; box-shadow:8px 8px 0 0 #000; padding:32px 40px; position:relative; }
  .left { flex:1.35; display:flex; flex-direction:column; gap:28px; }
  .pill { align-self:flex-start; border:5px solid #000; border-radius:10px; box-shadow:5px 5px 0 0 #000; background:var(--y); font-weight:900; font-size:32px; padding:8px 22px; }
  .t { font-weight:900; font-size:96px; line-height:1.02; letter-spacing:-2px; }
  .mark { display:inline-block; background:var(--r); color:#fff; border:5px solid #000; padding:2px 14px; margin-top:10px; line-height:1.05; white-space:nowrap; }
  .right { flex:1; display:flex; flex-direction:column; gap:28px; align-items:stretch; }
  .big { font-weight:900; font-size:150px; line-height:1; white-space:nowrap; text-align:center; }
  .note { font-weight:800; font-size:34px; text-align:center; margin-top:8px; }
  .sticker { width:200px; height:200px; position:absolute; right:-24px; top:-120px; transform:rotate(10deg); filter:drop-shadow(8px 8px 0 #000); }
</style></head><body>
<script src="content.js"></script>
<script>
const C = window.CONTENT, Y = C.youtube || {}, L = Y.lines || C.cover.lines;
const big = Y.big || C.cover.big, note = Y.bigNote || C.cover.bigNote, icon = Y.icon || C.cover.icon;
document.body.insertAdjacentHTML('beforeend', `<section class="card">
  <div class="left">
    <div class="pill">${Y.tag || C.cover.tag}</div>
    <div class="t">${L.slice(0, -1).join('<br>')}${L.length > 1 ? '<br>' : ''}<span class="mark">${L[L.length - 1]}</span></div>
  </div>
  <div class="right">
    ${big ? `<div class="b" style="background:var(--y)">${icon ? `<img class="sticker" src="icons/${icon}_3d.png">` : ''}<div class="big">${big}</div>${note ? `<div class="note">${note}</div>` : ''}</div>` : ''}
  </div></section>`);
</script>
</body></html>
