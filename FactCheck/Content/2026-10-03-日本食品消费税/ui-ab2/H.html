<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>H</title>
<link rel="stylesheet" href="fonts.css">
<style>
  :root { --ink:#1d2129; --ink2:#4e5969; --ink3:#86909c; --blue:#1783FF; --orange:#F0884D; --teal:#00C9C9; --violet:#7863FF; --bg:#f7f8fa; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#999; font-family:"NSans",sans-serif; color:var(--ink); }
  .card { width:1080px; height:1440px; margin:0 auto 40px; background:#fff; padding:64px 64px 40px; display:flex; flex-direction:column; position:relative; overflow:hidden; }
  .card::before { content:""; position:absolute; left:0; top:0; right:0; height:14px; background:linear-gradient(90deg, var(--blue), var(--teal), var(--violet), var(--orange)); }
  .top { display:flex; justify-content:space-between; align-items:center; font-size:24px; color:var(--ink3); margin-bottom:26px; }
  .top .tag { color:var(--blue); font-weight:800; background:#e8f3ff; padding:8px 20px; border-radius:8px; }
  h1 { font-weight:900; font-size:92px; line-height:1.2; }
  h2 { font-weight:900; font-size:64px; line-height:1.25; }
  .hl { color:var(--blue); } .ho { color:var(--orange); }
  .ig { width:952px; margin:16px 0; flex:none; }
  .card.nohero .ig { margin:auto 0; }
  .foot { padding-top:18px; border-top:1px solid #e5e6eb; display:flex; justify-content:space-between; gap:30px; font-size:20px; color:var(--ink3); line-height:1.5; }
  .foot b { color:var(--ink); white-space:nowrap; }
  .sub { font-size:34px; line-height:1.55; color:var(--ink2); margin-top:20px; }
  .hero { flex:1; display:flex; flex-direction:column; justify-content:center; }
  .hero .n { font-weight:900; font-size:300px; line-height:.95; letter-spacing:-8px; }
  .hero .row2 { display:flex; gap:40px; }
  .hero .k { font-size:28px; color:var(--ink3); font-weight:700; }
  .box { background:var(--bg); border-radius:16px; padding:24px 30px; font-size:27px; line-height:1.65; color:var(--ink2); margin-top:12px; }
</style></head><body>
<script src="content.js"></script>
<script src="icons.js"></script>
<script src="file:///tmp/claude-0/-home-user--001/7cd23158-c545-5d09-8873-6fad041a8c25/scratchpad/antv/node_modules/@antv/infographic/dist/infographic.min.js"></script>
<script>
window.__ready = false;
const C = window.CONTENT, T = 8, IC = window.ICONS;
const theme = (pal) => `theme
  palette ${pal}
  base
    text
      font-family NSans`;
const pages = [];
const card = (i, tag, head, dsl, extra, src, igH) => { pages.push(dsl); return `<section class="card ${head.includes('class="hero"') ? '' : 'nohero'}"><div class="top"><span class="tag">${tag}</span><span>${i} / ${T}</span></div>${head}<div class="ig" id="ig${pages.length - 1}" style="height:${igH}px"></div>${extra}<div class="foot"><span>${src}</span><b>${C.handle}</b></div></section>`; };
let h = '';
h += card(1, C.cover.tag, `<h1>${C.cover.lines[0]}<br>${C.cover.lines[1]}<br><span class="ho">${C.cover.lines[2]}</span></h1><div class="hero"><div class="k">税后</div><div class="n ho">9%</div><div class="sub" style="margin-top:10px">${C.cover.sub}</div></div>`,
`infographic compare-binary-horizontal-badge-card-vs
data
  compares
    - label 店里吃（堂食）
      icon ${IC.fork_and_knife_with_plate}
      children
        - label 消费税 10%
          desc 税前1000日元 → 付1100
    - label 带走 / 超市
      icon ${IC.takeout_box}
      children
        - label 消费税 1%
          desc 税前1000日元 → 付1010
${theme('#F0884D #1783FF')}`, '', C.cover.src, 640);
h += card(2, C.facts.tag, `<h2>${C.facts.title}</h2><div class="hero"><div class="k">超市、便利店食品与外带的消费税</div><div class="n hl" style="font-size:230px">8%→1%</div><div class="sub">堂食与酒类仍是 10%，2027年4月起限时 2 年</div></div>`,
`infographic list-grid-badge-card
data
  lists
${C.facts.rows.map((r, i) => `    - label ${r.hi}
      desc ${r.k}：${r.v}
      icon ${IC[['shopping_cart', 'fork_and_knife_with_plate', 'hourglass_not_done', 'classical_building'][i]]}`).join('\n')}
${theme('#1783FF #F0884D #00C9C9 #7863FF')}`, '', C.facts.src, 1000);
h += card(3, C.chart.tag, `<h2>${C.chart.title}：<span class="ho">${C.chart.titleHi}</span></h2>`,
`infographic chart-column-simple
data
  values
    - label 堂食·现在
      value 10
    - label 外带·现在
      value 8
    - label 堂食·2027
      value 10
    - label 外带·2027
      value 1
${theme('#F0884D #1783FF #F0884D #1783FF')}`, `<div class="box">现在税后差约 <b>2%</b> → 2027年4月起税后差约 <b class="ho">9%</b>。${C.chart.note}</div>`, C.chart.src, 860);
h += card(4, C.gain.tag, `<h2>${C.gain.title}，<span class="hl">${C.gain.titleHi}</span></h2><div class="hero"><div class="row2"><div><div class="k">${C.gain.stats[0].label}</div><div class="n" style="font-size:200px;color:#00b0b0">4.8<span style="font-size:40px;letter-spacing:0">万</span></div></div><div><div class="k">${C.gain.stats[1].label}</div><div class="n" style="font-size:200px;color:var(--violet)">8.2<span style="font-size:40px;letter-spacing:0">万</span></div></div></div></div>`,
`infographic compare-binary-horizontal-compact-card-vs
data
  compares
    - label 年收250–300万日元
      icon ${IC.house}
      children
        - label 年省约4.8万日元
          desc 占收入比例更高
    - label 年收1500万日元以上
      icon ${IC.bank}
      children
        - label 年省约8.2万日元
          desc 绝对金额更多
${theme('#00C9C9 #7863FF')}`, `<div class="box">${C.gain.points.join('；')}。</div>`, C.gain.src, 820);
h += card(5, C.loss.tag, `<h2>${C.loss.title}</h2>`,
`infographic list-column-vertical-icon-arrow
data
  lists
${C.loss.rows.map((r, i) => `    - label ${r.who}
      desc ${r.what}
      icon ${IC[['fork_and_knife_with_plate', 'convenience_store', 'bank'][i]]}`).join('\n')}
${theme('#F0884D #7863FF #1783FF')}`, `<div class="box" style="font-weight:700;color:var(--ink);font-size:32px">${C.loss.kicker}</div>`, C.loss.src, 880);
h += card(6, C.chain.tag, `<h2>${C.chain.title}</h2><div class="hero"><div class="k">日本10年期国债利率 · 到2026年底 · <span class="ho">预测</span></div><div class="n hl" style="font-size:260px">→ 3%</div><div class="sub">一份便当的税差，最终可能传导到国债和日元</div></div>`,
`infographic sequence-ascending-stairs-3d
data
  sequences
${C.chain.steps.map((s, i) => `    - label ${s.t}
      desc ${s.pred ? '【预测】' : ''}${s.d}
      icon ${IC[['yen_banknote', 'bank', 'chart_increasing', 'balance_scale'][i]]}`).join('\n')}
${theme('#1783FF #00C9C9 #F0884D #7863FF')}`, `<div class="box">${C.chain.compare}</div>`, C.chain.src, 820);
h += card(7, C.block.tag, `<h2>${C.block.title}</h2><div class="hero"><div class="k">执政联盟在参议院距过半数</div><div class="n ho" style="font-size:260px">差 4 席</div><div class="sub">另有三道关：在野党统一立场、财源未定、时间很紧</div></div>`,
`infographic list-grid-badge-card
data
  lists
${C.block.items.map((it, i) => `    - label ${it.t}
      desc ${it.d}
      icon ${IC[['classical_building', 'balance_scale', 'yen_banknote', 'hourglass_not_done'][i]]}`).join('\n')}
${theme('#F0884D #1783FF #7863FF #00C9C9')}`, '', C.block.src, 1060);
h += card(8, C.end.tag, `<h1 style="font-size:70px;line-height:1.4">${C.end.quote[0]}<br>${C.end.quote[1]}<br><span class="hl">${C.end.quote[2]}<br>${C.end.quote[3]}</span></h1>`,
`infographic list-row-horizontal-icon-arrow
data
  title ${C.end.watchTitle}
  lists
${C.end.watch.map((w, i) => `    - label ${w[0]}
      desc ${w[1]}
      icon ${IC[['classical_building', 'bank', 'chart_increasing'][i]]}`).join('\n')}
${theme('#1783FF #00C9C9 #F0884D')}`, '', C.end.src, 620);
document.body.insertAdjacentHTML('beforeend', h);
const I = window.AntVInfographic.Infographic;
pages.forEach((dsl, k) => {
  const el = document.getElementById('ig' + k);
  const ig = new I({ container: el, width: el.clientWidth, height: el.clientHeight });
  ig.render(dsl);
});
setTimeout(() => {
  // 放大到撑满容器：只统计真实内容（排除铺满容器的背景），再整体缩放居中
  pages.forEach((_, k) => {
    const el = document.getElementById('ig' + k), svg = el.querySelector('svg');
    if (!svg) return;
    const box = el.getBoundingClientRect();
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    svg.querySelectorAll('text, path, rect, circle, ellipse, line, polyline, polygon, image, use, foreignObject').forEach(n => {
      const r = n.getBoundingClientRect();
      if (!r.width && !r.height) return;
      if (r.width > box.width * .95 && r.height > box.height * .95) return;
      x0 = Math.min(x0, r.left); y0 = Math.min(y0, r.top); x1 = Math.max(x1, r.right); y1 = Math.max(y1, r.bottom);
    });
    if (x1 <= x0) return;
    const pad = 10, bw = x1 - x0 + pad * 2, bh = y1 - y0 + pad * 2;
    const sc = Math.min(box.width / bw, box.height / bh, 3);
    let H = box.height;
    if (box.width / bw < box.height / bh) { H = bh * sc; el.style.height = H + 'px'; }
    const nb = el.getBoundingClientRect();
    const cx = (x0 + x1) / 2 - box.left, cy = (y0 + y1) / 2 - box.top;
    svg.style.transformOrigin = '0 0';
    svg.style.transform = `translate(${box.width / 2 - cx * sc}px, ${H / 2 - cy * sc}px) scale(${sc})`;
    el.style.overflow = 'hidden';
  });
  window.__ready = true;
}, 6000);
</script>
</body></html>
