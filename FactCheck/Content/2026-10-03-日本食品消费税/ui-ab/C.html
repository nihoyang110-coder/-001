<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>C</title>
<link rel="stylesheet" href="fonts.css">
<style>
  :root { --bg:#09090B; --win:#18181B; --line:rgba(255,255,255,.10); --ink:#E4E4E7; --ink2:#A1A1AA; --ink3:#71717A; --acc:#FB923C; --acc2:#38BDF8; --ok:#4ADE80; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#333; font-family:"NSans",sans-serif; color:var(--ink); }
  .card { width:1080px; height:1440px; margin:0 auto 40px; padding:64px 52px; position:relative; overflow:hidden;
    background-color:var(--bg); background-image:radial-gradient(rgba(255,255,255,.09) 2px, transparent 2px); background-size:36px 36px; }
  .glow { position:absolute; width:700px; height:700px; border-radius:50%; background:radial-gradient(circle, rgba(251,146,60,.16), transparent 65%); top:-200px; right:-200px; }
  .win { position:relative; background:var(--win); border:1px solid var(--line); border-radius:28px; box-shadow:0 40px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.04); height:100%; display:flex; flex-direction:column; overflow:hidden; }
  .bar { display:flex; align-items:center; gap:14px; padding:24px 30px; border-bottom:1px solid var(--line); background:#1f1f23; }
  .dot { width:22px; height:22px; border-radius:50%; }
  .bar .ttl { margin-left:auto; margin-right:auto; font-family:"JBMono"; font-size:24px; color:var(--ink3); transform:translateX(-40px); }
  .body { padding:52px 56px 34px; flex:1; display:flex; flex-direction:column; }
  .meta { font-family:"JBMono"; font-size:24px; color:var(--acc2); margin-bottom:26px; }
  .meta b { color:var(--ok); font-weight:500; }
  h1 { font-weight:800; font-size:94px; line-height:1.2; letter-spacing:-1px; }
  h2 { font-weight:800; font-size:70px; line-height:1.25; margin-bottom:38px; }
  .o { color:var(--acc); }
  .foot { margin-top:auto; padding-top:22px; border-top:1px solid var(--line); display:flex; justify-content:space-between; gap:30px; font-size:21px; color:var(--ink3); line-height:1.5; }
  .foot b { font-family:"JBMono"; font-weight:500; color:var(--ink2); white-space:nowrap; }
  .big { font-family:"JBMono"; font-weight:800; font-size:300px; line-height:1; color:var(--acc); letter-spacing:-10px; text-shadow:0 0 60px rgba(251,146,60,.35); margin-top:20px; }
  .big small { font-family:"NSans"; font-size:48px; color:var(--ink2); letter-spacing:0; text-shadow:none; font-weight:500; }
  .code { margin-top:40px; background:#0f0f12; border:1px solid var(--line); border-radius:18px; padding:30px 34px; font-size:38px; line-height:1.5; font-weight:600; }
  .code::before { content:"> "; font-family:"JBMono"; color:var(--ok); }
  .kv { display:grid; grid-template-columns:140px 1fr; gap:20px; padding:26px 0; border-bottom:1px solid var(--line); }
  .kv .k { font-family:"JBMono"; font-size:26px; color:var(--acc2); padding-top:8px; }
  .kv .v { font-size:36px; line-height:1.45; color:var(--ink2); }
  .kv .v b { display:block; font-family:"JBMono"; font-size:56px; color:var(--ink); font-weight:700; margin-top:4px; }
  .panel { background:#0f0f12; border:1px solid var(--line); border-radius:20px; padding:36px; }
  .legend { display:flex; gap:34px; font-size:26px; color:var(--ink2); margin-bottom:70px; }
  .legend i { display:inline-block; width:24px; height:24px; border-radius:6px; margin-right:10px; vertical-align:-4px; }
  .plot { display:flex; gap:90px; align-items:flex-end; height:400px; border-bottom:2px solid var(--ink3); padding:0 30px;
    background-image:linear-gradient(var(--line) 1px, transparent 1px); background-size:100% 100px; }
  .grp { flex:1; display:flex; gap:8px; align-items:flex-end; height:100%; }
  .b { flex:1; border-radius:10px 10px 0 0; position:relative; }
  .b span { position:absolute; top:-58px; left:0; right:0; text-align:center; font-family:"JBMono"; font-weight:700; font-size:44px; }
  .xl { display:flex; gap:90px; padding:18px 30px 0; }
  .xl div { flex:1; text-align:center; font-size:28px; color:var(--ink2); }
  .xl div b { display:block; font-size:36px; color:var(--ink); margin-top:6px; }
  .stats { display:flex; gap:24px; }
  .stat { flex:1; background:#0f0f12; border:1px solid var(--line); border-radius:20px; padding:32px; }
  .stat .l { font-size:26px; color:var(--ink2); }
  .stat .n { font-family:"JBMono"; font-weight:800; font-size:130px; line-height:1.1; }
  .stat .u { font-family:"JBMono"; font-size:24px; color:var(--ink3); }
  .stat.hot { border-color:rgba(251,146,60,.6); box-shadow:0 0 40px rgba(251,146,60,.15) inset; }
  .stat.hot .n { color:var(--acc); }
  .li { font-size:34px; color:var(--ink2); padding:14px 0; }
  .li::before { content:"✓ "; color:var(--ok); font-family:"JBMono"; }
  .row { display:grid; grid-template-columns:190px 1fr; gap:20px; padding:30px 0; border-bottom:1px solid var(--line); }
  .row .w { font-weight:800; font-size:46px; }
  .row .t { font-size:34px; line-height:1.55; color:var(--ink2); }
  .step { background:#0f0f12; border:1px solid var(--line); border-radius:16px; padding:22px 30px; display:flex; justify-content:space-between; align-items:center; gap:20px; }
  .step .t { font-weight:800; font-size:42px; }
  .step .d { font-family:"JBMono"; font-size:22px; color:var(--acc2); white-space:nowrap; }
  .arr { font-family:"JBMono"; color:var(--ink3); font-size:34px; padding:4px 0 4px 30px; }
  .pred { font-family:"JBMono"; font-size:20px; color:var(--bg); background:var(--acc); border-radius:6px; padding:2px 10px; margin-left:12px; vertical-align:8px; }
  .warn { margin-top:28px; border:1px solid rgba(56,189,248,.35); background:rgba(56,189,248,.06); border-radius:16px; padding:22px 28px; font-size:26px; line-height:1.65; color:var(--ink2); }
  .warn::before { content:"// history"; display:block; font-family:"JBMono"; color:var(--acc2); font-size:22px; margin-bottom:6px; }
  .obs { display:grid; grid-template-columns:90px 1fr; padding:26px 0; border-bottom:1px solid var(--line); }
  .obs .n { font-family:"JBMono"; font-size:40px; color:var(--acc); font-weight:700; }
  .obs .t { font-weight:800; font-size:42px; }
  .obs .d { font-size:28px; color:var(--ink2); margin-top:6px; line-height:1.5; }
  .q { font-weight:800; font-size:78px; line-height:1.4; margin:24px 0 46px; }
  .term { background:#0f0f12; border:1px solid var(--line); border-radius:18px; padding:30px 34px; font-family:"JBMono"; }
  .term .h { color:var(--ok); font-size:26px; margin-bottom:12px; }
  .term .w { font-family:"NSans"; font-size:36px; padding:8px 0; }
  .term .w span { font-family:"JBMono"; color:var(--acc2); font-size:28px; margin-right:22px; }
</style></head><body>
<script src="content.js"></script>
<script>
const C = window.CONTENT, T = 8;
const files = ['cover.md','facts.md','chart.md','winners.md','losers.md','chain.md','blockers.md','takeaway.md'];
const card = (i, tag, src, inner) => `<section class="card"><div class="glow"></div><div class="win"><div class="bar"><span class="dot" style="background:#FF5F57"></span><span class="dot" style="background:#FEBC2E"></span><span class="dot" style="background:#28C840"></span><span class="ttl">${files[i-1]}</span></div><div class="body"><div class="meta"># ${tag} <b>· ${i}/${T}</b></div>${inner}<div class="foot"><span>${src}</span><b>${C.handle}</b></div></div></div></section>`;
let h = '';
h += card(1, C.cover.tag, C.cover.src, `<h1>${C.cover.lines[0]}<br>${C.cover.lines[1]}<br><span class="o">${C.cover.lines[2]}</span></h1><div class="big">9%<small> 税后</small></div><div class="code">${C.cover.sub}</div>`);
h += card(2, C.facts.tag, C.facts.src, `<h2>${C.facts.title}</h2>${C.facts.rows.map(r => `<div class="kv"><div class="k">${r.k}</div><div class="v">${r.v}<b>${r.hi}</b></div></div>`).join('')}`);
const g = C.chart.groups;
h += card(3, C.chart.tag, C.chart.src, `<h2>${C.chart.title}<br><span class="o">${C.chart.titleHi}</span></h2>
  <div class="panel"><div class="legend"><span><i style="background:var(--acc)"></i>${C.chart.legend.dine}</span><span><i style="background:var(--acc2)"></i>${C.chart.legend.take}</span></div>
  <div class="plot">${g.map(x => `<div class="grp"><div class="b" style="height:${x.dine*34}px;background:var(--acc)"><span>${x.dine}%</span></div><div class="b" style="height:${Math.max(x.take*34,12)}px;background:var(--acc2)"><span>${x.take}%</span></div></div>`).join('')}</div>
  <div class="xl">${g.map((x, i) => `<div>${x.label}<b style="color:${i ? 'var(--acc)' : 'var(--ink)'}">${x.gap}</b></div>`).join('')}</div></div>
  <div class="code" style="font-size:30px;font-weight:500">${C.chart.note}</div>`);
h += card(4, C.gain.tag, C.gain.src, `<h2>${C.gain.title}<br><span class="o">${C.gain.titleHi}</span></h2>
  <div class="stats">${C.gain.stats.map((s, i) => `<div class="stat ${i ? 'hot' : ''}"><div class="l">${s.label}</div><div class="n">${s.n}</div><div class="u">${s.unit}</div></div>`).join('')}</div>
  <div style="margin-top:30px">${C.gain.points.map(p => `<div class="li">${p}</div>`).join('')}</div>`);
h += card(5, C.loss.tag, C.loss.src, `<h2>${C.loss.title}</h2>${C.loss.rows.map(r => `<div class="row"><div class="w">${r.who}</div><div class="t">${r.what}</div></div>`).join('')}<div class="code" style="font-size:34px">${C.loss.kicker}</div>`);
h += card(6, C.chain.tag, C.chain.src, `<h2>${C.chain.title}</h2>${C.chain.steps.map((s, i) => `${i ? '<div class="arr">│<br>↓</div>' : ''}<div class="step"><div class="t">${s.t}${s.pred ? '<span class="pred">预测</span>' : ''}</div><div class="d">${s.d}</div></div>`).join('')}<div class="warn">${C.chain.compare}</div>`);
h += card(7, C.block.tag, C.block.src, `<h2>${C.block.title}</h2>${C.block.items.map((it, i) => `<div class="obs"><div class="n">0${i+1}</div><div><div class="t">${it.t}</div><div class="d">${it.d}</div></div></div>`).join('')}`);
h += card(8, C.end.tag, C.end.src, `<div class="q">${C.end.quote[0]}<br>${C.end.quote[1]}<br><span class="o">${C.end.quote[2]}<br>${C.end.quote[3]}</span></div>
  <div class="term"><div class="h">$ watch --next 3</div>${C.end.watch.map(w => `<div class="w"><span>${w[0]}</span>${w[1]}</div>`).join('')}</div>`);
document.body.insertAdjacentHTML('beforeend', h);
</script>
</body></html>
