<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>A</title>
<link rel="stylesheet" href="fonts.css">
<style>
  :root { --paper:#f4f2ee; --ink:#141210; --ink2:#55514b; --acc:#e4401c; --rule:#141210; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#999; font-family:"NSans",sans-serif; color:var(--ink); }
  .card { width:1080px; height:1440px; background:var(--paper); position:relative; overflow:hidden; margin:0 auto 40px; }
  .micro { position:absolute; font-family:"JBMono",monospace; font-size:22px; letter-spacing:4px; text-transform:uppercase; color:var(--ink); z-index:5; }
  .tl { top:56px; left:64px; } .tr { top:56px; right:64px; text-align:right; } .bl { bottom:48px; left:64px; right:300px; font-family:"NSans"; letter-spacing:0; text-transform:none; font-size:22px; color:var(--ink2); line-height:1.5; } .br { bottom:48px; right:64px; }
  .slab { position:absolute; background:var(--acc); }
  .blk { position:absolute; background:var(--ink); }
  h1,h2 { font-weight:900; letter-spacing:-2px; }
  .z { position:relative; z-index:4; }
  /* cover */
  .c-num { position:absolute; right:-70px; top:300px; font-family:"NSans"; font-weight:900; font-size:860px; line-height:.8; color:var(--acc); letter-spacing:-60px; z-index:1; }
  .c-head { position:absolute; left:64px; top:180px; font-size:118px; line-height:1.02; font-weight:900; z-index:3; }
  .c-note { position:absolute; left:64px; top:600px; font-family:"JBMono"; font-size:24px; letter-spacing:4px; z-index:3; }
  .c-sub { position:absolute; left:0; bottom:150px; width:760px; background:var(--ink); color:var(--paper); padding:44px 64px; font-size:44px; line-height:1.4; font-weight:700; z-index:4; }
  /* generic page */
  .p-title { position:absolute; left:64px; top:150px; right:64px; font-size:96px; line-height:1.05; z-index:4; }
  .p-title em { font-style:normal; color:var(--acc); display:block; }
  .idx { position:absolute; right:-30px; top:60px; font-weight:900; font-size:420px; line-height:.8; color:var(--ink); opacity:.07; z-index:0; letter-spacing:-20px; }
  .rows { position:absolute; left:64px; right:64px; top:470px; border-top:6px solid var(--rule); z-index:4; }
  .row { display:grid; grid-template-columns:150px 1fr; gap:24px; padding:30px 0; border-bottom:2px solid var(--rule); }
  .row .k { font-family:"JBMono"; font-size:24px; letter-spacing:3px; padding-top:10px; }
  .row .v { font-size:38px; line-height:1.35; font-weight:500; }
  .row .v b { display:block; font-size:62px; font-weight:900; color:var(--acc); margin-top:6px; }
  /* chart */
  .bars { position:absolute; left:64px; right:64px; top:520px; height:560px; display:flex; gap:80px; align-items:flex-end; border-bottom:6px solid var(--ink); z-index:4; }
  .grp { flex:1; display:flex; gap:6px; align-items:flex-end; height:100%; position:relative; }
  .bar { flex:1; position:relative; }
  .bar span { position:absolute; top:-84px; left:0; right:0; text-align:center; font-weight:900; font-size:60px; }
  .glab { position:absolute; bottom:-74px; left:0; font-family:"JBMono"; font-size:24px; letter-spacing:3px; }
  .gap { position:absolute; left:64px; right:64px; top:1150px; display:flex; gap:80px; z-index:4; }
  .gap div { flex:1; font-size:40px; font-weight:900; }
  .gap div:last-child { color:var(--acc); }
  .legend { position:absolute; left:64px; top:440px; font-size:26px; display:flex; gap:40px; z-index:4; }
  .legend i { display:inline-block; width:26px; height:26px; margin-right:10px; vertical-align:-4px; }
  .note { position:absolute; left:64px; right:64px; top:1240px; font-size:30px; color:var(--ink2); z-index:4; }
  /* stats */
  .stat { position:absolute; z-index:4; }
  .stat .n { font-weight:900; font-size:300px; line-height:.85; letter-spacing:-14px; }
  .stat .u { font-family:"JBMono"; font-size:24px; letter-spacing:3px; margin-top:16px; }
  .stat .l { font-size:30px; font-weight:700; margin-bottom:12px; }
  .pts { position:absolute; left:64px; right:64px; top:1010px; z-index:4; border-top:6px solid var(--ink); }
  .pts div { font-size:34px; padding:18px 0; border-bottom:2px solid var(--ink); }
  /* chain */
  .chain { position:absolute; left:64px; right:64px; top:420px; z-index:4; }
  .step { display:grid; grid-template-columns:90px 1fr; border-top:6px solid var(--ink); padding:22px 0 26px; }
  .step .i { font-family:"JBMono"; font-size:56px; font-weight:800; color:var(--acc); }
  .step .t { font-size:48px; font-weight:900; line-height:1.15; }
  .step .d { font-family:"NSans"; font-size:26px; color:var(--ink2); margin-top:6px; }
  .pred { font-family:"JBMono"; font-size:20px; letter-spacing:3px; background:var(--acc); color:var(--paper); padding:4px 10px; vertical-align:12px; margin-left:12px; }
  .cmp { position:absolute; left:0; right:200px; bottom:130px; background:var(--ink); color:var(--paper); padding:36px 64px; font-size:27px; line-height:1.6; z-index:4; }
  /* quote */
  .q { position:absolute; left:64px; top:230px; right:64px; font-size:104px; line-height:1.12; font-weight:900; letter-spacing:-3px; z-index:4; }
  .q span:nth-child(3), .q span:nth-child(4) { color:var(--acc); }
  .watch { position:absolute; left:64px; right:64px; top:1000px; z-index:4; border-top:6px solid var(--ink); }
  .watch .h { font-family:"JBMono"; font-size:22px; letter-spacing:4px; padding:18px 0; }
  .watch .w { display:grid; grid-template-columns:200px 1fr; font-size:38px; font-weight:700; padding:14px 0; border-top:2px solid var(--ink); }
  .watch .w span { font-family:"JBMono"; font-size:28px; font-weight:800; color:var(--acc); padding-top:6px; }
</style></head><body>
<script src="content.js"></script>
<script>
const C = window.CONTENT, T = 8;
const micro = (i, tag, src) => `<div class="micro tl">${String(i).padStart(2,'0')} / ${String(T).padStart(2,'0')}</div><div class="micro tr">${tag}</div><div class="micro bl">${src}</div><div class="micro br">${C.handle}</div>`;
const page = (i, tag, src, inner) => `<section class="card">${micro(i, tag, src)}${inner}</section>`;
let h = '';
// 1 cover
h += page(1, C.cover.tag, C.cover.src, `
  <div class="c-num" data-bleed>9</div>
  <div class="slab" style="left:0;top:0;width:24px;height:1440px"></div>
  <h1 class="c-head">${C.cover.lines.join('<br>')}</h1>
  <div class="c-note">（${C.cover.bigNote}）· 9%</div>
  <div class="c-sub">${C.cover.sub}</div>`);
// 2 facts
h += page(2, C.facts.tag, C.facts.src, `<div class="idx" data-bleed>02</div><h2 class="p-title">${C.facts.title}</h2>
  <div class="rows">${C.facts.rows.map(r => `<div class="row"><div class="k">${r.k}</div><div class="v">${r.v}<b>${r.hi}</b></div></div>`).join('')}</div>`);
// 3 chart
const g = C.chart.groups, scale = 46;
h += page(3, C.chart.tag, C.chart.src, `<h2 class="p-title">${C.chart.title}<em>${C.chart.titleHi}</em></h2>
  <div class="legend"><span><i style="background:var(--acc)"></i>${C.chart.legend.dine}</span><span><i style="background:var(--ink)"></i>${C.chart.legend.take}</span></div>
  <div class="bars">${g.map(x => `<div class="grp"><div class="bar" style="height:${x.dine*scale}px;background:var(--acc)"><span>${x.dine}%</span></div><div class="bar" style="height:${x.take*scale}px;background:var(--ink)"><span>${x.take}%</span></div><div class="glab">${x.label}</div></div>`).join('')}</div>
  <div class="gap">${g.map(x => `<div>${x.gap}</div>`).join('')}</div>
  <div class="note">${C.chart.note}</div>`);
// 4 gain
const s = C.gain.stats;
h += page(4, C.gain.tag, C.gain.src, `<h2 class="p-title">${C.gain.title}<em>${C.gain.titleHi}</em></h2>
  <div class="stat" style="left:64px;top:470px"><div class="l">${s[0].label}</div><div class="n">${s[0].n}</div><div class="u">${s[0].unit}</div></div>
  <div class="slab" style="left:560px;top:430px;width:520px;height:520px"></div>
  <div class="stat" style="left:600px;top:470px;color:var(--paper)"><div class="l">${s[1].label}</div><div class="n">${s[1].n}</div><div class="u">${s[1].unit}</div></div>
  <div class="pts">${C.gain.points.map(p => `<div>${p}</div>`).join('')}</div>`);
// 5 loss
h += page(5, C.loss.tag, C.loss.src, `<div class="idx" data-bleed>05</div><h2 class="p-title">${C.loss.title}</h2>
  <div class="rows" style="top:360px">${C.loss.rows.map(r => `<div class="row" style="grid-template-columns:220px 1fr"><div class="v" style="font-weight:900;font-size:52px">${r.who}</div><div class="v" style="font-size:34px">${r.what}</div></div>`).join('')}</div>
  <div class="cmp" style="bottom:150px;font-size:40px;font-weight:700;line-height:1.45">${C.loss.kicker}</div>`);
// 6 chain
h += page(6, C.chain.tag, C.chain.src, `<h2 class="p-title">${C.chain.title}</h2>
  <div class="chain">${C.chain.steps.map((st, i) => `<div class="step"><div class="i">${i+1}</div><div><div class="t">${st.t}${st.pred ? '<span class="pred">预测</span>' : ''}</div><div class="d">${st.d}</div></div></div>`).join('')}</div>
  <div class="cmp">${C.chain.compare}</div>`);
// 7 block
h += page(7, C.block.tag, C.block.src, `<div class="slab" style="right:0;top:0;width:300px;height:1440px;opacity:.95"></div><h2 class="p-title" style="right:340px">${C.block.title}</h2>
  <div class="rows" style="top:480px;right:340px">${C.block.items.map((it, i) => `<div class="row" style="grid-template-columns:80px 1fr"><div class="k" style="font-size:44px;font-weight:800;color:var(--acc)">${i+1}</div><div class="v" style="font-weight:900;font-size:44px">${it.t}<div style="font-size:28px;font-weight:400;color:var(--ink2);margin-top:8px">${it.d}</div></div></div>`).join('')}</div>
  <div style="position:absolute;right:30px;top:300px;writing-mode:vertical-rl;font-weight:900;font-size:180px;color:var(--paper);z-index:3;letter-spacing:10px">差4席</div>`);
// 8 end
h += page(8, C.end.tag, C.end.src, `<div class="q">${C.end.quote.map(q => `<span>${q}</span><br>`).join('')}</div>
  <div class="watch"><div class="h">${C.end.watchTitle}</div>${C.end.watch.map(w => `<div class="w"><span>${w[0]}</span>${w[1]}</div>`).join('')}</div>`);
document.body.insertAdjacentHTML('beforeend', h);
</script>
</body></html>
